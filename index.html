var ST=[
{id:"maggie",k:"HISTORY",w:"Black Rose Bar",t:"Half-Hangit Maggie",x:"In 1724 Margaret Dickson was hanged in the Grassmarket and placed in a coffin for burial. On the way, she was found to be breathing. The law could not hang her twice, so she walked free, and Edinburgh called her Half-Hangit Maggie for the rest of her life."},
{id:"maiden",k:"HISTORY",w:"Black Rose Bar",t:"The Maiden",x:"Scotland's guillotine arrived in Edinburgh in 1564, more than two centuries before the French one. It was used for over 150 years. The Earl of Morton, said to have helped bring it to Scotland, was executed on it in 1581. The original is kept by National Museums Scotland."},
{id:"weir",k:"HISTORY AND LEGEND",w:"Black Rose Cellar",t:"Major Weir",x:"Thomas Weir was admired for his piety until 1670, when he confessed to terrible crimes and was executed. Legend says his walking stick moved by itself, and that his house on the West Bow stood empty for over a century."},
{id:"brodie",k:"HISTORY",w:"Black Rose Cellar",t:"Deacon Brodie",x:"By day William Brodie was a respected cabinet maker and town councillor. By night he copied his clients' keys and robbed them. He was hanged in 1788, and Robert Louis Stevenson later drew on his double life for Jekyll and Hyde."},
{id:"banshee",k:"LEGEND",w:"The Banshee Bar",t:"Why the Banshee?",x:"In Irish folklore a banshee's scream warns that someone is about to die. Local tradition says workers renovating this building heard a scream in the dark with no source. The old name, Nicol Edward's, was dropped, and the Banshee Labyrinth began."},
{id:"nicol",k:"LEGEND",w:"The Banshee Bar",t:"Nicol Edwards",x:"Nicol Edwards was a wealthy Edinburgh merchant, and the pub on this site carried his name long after he was gone. Local tradition calls him a hard, cruel man and says windowless rooms beneath his house held women accused of witchcraft. No record confirms the darkest version."},
{id:"vaults",k:"HISTORY",w:"South Bridge Vaults",t:"The South Bridge Vaults",x:"Completed in the late 1700s, the South Bridge hides a row of nineteen arches with chambers beneath. Tradesmen used them at first, but damp drove them out and the poor moved in. Many vaults were sealed and forgotten for around a century, and only a fraction have ever been opened."},
{id:"fire",k:"HISTORY",w:"South Bridge Vaults",t:"The Great Fire, 1824",x:"On 15 November 1824 fire tore through the Old Town's crowded timber tenements and burned for days. It led to the first municipal fire brigade, set up under James Braidwood the following year."},
{id:"cowgate",k:"LEGEND",w:"The Cowgate",t:"Ghosts of the Cowgate",x:"The Cowgate sits low, below the bridges, and was long a street of poverty and overcrowding. People report footsteps with no one there, cold spots and voices at the edge of hearing. None of it can be proved, and all of it keeps repeating."},
{id:"plague",k:"HISTORY",w:"The Cowgate",t:"Poverty and Plague",x:"Old Town tenements rose as high as eleven storeys, with almost no sanitation and little light on the lower floors. When fever or plague arrived, it spread fast. Edinburgh's ghost stories grew out of real suffering like this."},
{id:"resurrection",k:"HISTORY",w:"The Cowgate",t:"The Resurrection Men",x:"Before Burke and Hare, grave robbers dug up fresh bodies at night with wooden spades and sold them to the medical schools. Families fought back with heavy iron mortsafes bolted over new graves."},
{id:"burke",k:"HISTORY",w:"Nicol Edward's Cellar",t:"Burke and Hare",x:"In 1827 and 1828 William Burke and William Hare killed an estimated sixteen people and sold the bodies to the anatomist Dr Robert Knox. Hare turned king's evidence. Burke was hanged on 28 January 1829."},
{id:"mackenzie",k:"LEGEND",w:"Nicol Edward's Cellar",t:"The Mackenzie Poltergeist",x:"Sir George Mackenzie, the Lord Advocate who prosecuted the Covenanters, was buried at Greyfriars in 1691. Since a break-in at his tomb in 1999, visitors have reported scratches, bruises and blackouts nearby. Sceptics blame suggestion, but the reports continue."},
{id:"covenanters",k:"HISTORY",w:"Nicol Edward's Cellar",t:"The Killing Time",x:"The Covenanters were Presbyterians who refused the crown's control over their church. After the Battle of Bothwell Bridge in 1679, around 1,200 prisoners were held in an open enclosure at Greyfriars through the winter. The years of persecution became known as the Killing Time."},
